name: Build APK & Upload Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Expo app (prepare native Android)
        working-directory: ./artifacts/social-scraper
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Build Release APK with Gradle
        working-directory: ./artifacts/social-scraper/android
        env:
          # Backend host for this build, set once as a repository variable
          # (gh variable set EXPO_PUBLIC_API_URL). Metro inlines it here, where
          # the JS bundle is produced; empty falls back to the default in
          # lib/apiConfig.ts.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          ./gradlew assembleRelease

      - name: Locate built APK
        id: apk
        working-directory: ./artifacts/social-scraper/android
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | grep -i release | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Could not find release APK"
            find . -name "*.apk" -type f
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Prepare APK artifact
        working-directory: ./artifacts/social-scraper/android
        run: |
          APK_PATH="${{ steps.apk.outputs.apk_path }}"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            find . -name "*.apk" -type f
            exit 1
          fi
          cp "$APK_PATH" "${{ github.workspace }}/social-scraper.apk"
          echo "APK copied successfully:"
          ls -lh "${{ github.workspace }}/social-scraper.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-scraper-release-apk-${{ github.run_number }}
          path: social-scraper.apk
          retention-days: 7

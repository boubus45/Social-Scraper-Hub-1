kind = "mobile"
previewPath = "/"
title = "SocialScraper"
version = "1.0.0"
id = "artifacts/social-scraper"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23595

[services.development]
run = "pnpm --filter @workspace/social-scraper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-scraper", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/social-scraper", "run", "serve" ]

[services.env]
PORT = "23595"
BASE_PATH = "/"
